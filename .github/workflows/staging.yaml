name: Deploy to Staging

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tests/**'
      - 'terraform/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - '.github/workflows/staging.yaml'

jobs:
  deploy_and_test_staging:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.WORKLOAD_IDENTITY_PROVIDER || format('projects/{0}/locations/global/workloadIdentityPools/{1}/providers/{2}', vars.GCP_PROJECT_NUMBER, secrets.WIF_POOL_ID, secrets.WIF_PROVIDER_ID) }}"
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
          create_credentials_file: true
          project_id: ${{ vars.GOOGLE_CLOUD_PROJECT || vars.CICD_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          install_components: 'beta'

      - name: Install dependencies
        run: uv sync --locked

      - name: Deploy to Staging (Agent Runtime)
        run: |
          PROJECT_ID="${{ vars.STAGING_PROJECT_ID || vars.GOOGLE_CLOUD_PROJECT }}"
          PROJECT_NAME="${{ vars.PROJECT_NAME || 'sre-agent' }}"
          LOGS_BUCKET="${{ vars.LOGS_BUCKET_NAME_STAGING || vars.LOGS_BUCKET_NAME }}"
          if [ -z "$LOGS_BUCKET" ] && [ -n "$PROJECT_ID" ]; then
            LOGS_BUCKET="${PROJECT_ID}-${PROJECT_NAME}-logs"
          fi

          ENV_VARS="OTEL_RESOURCE_ATTRIBUTES=service.version=${{ github.sha }}"
          if [ -n "$LOGS_BUCKET" ]; then
            ENV_VARS="${ENV_VARS},LOGS_BUCKET_NAME=${LOGS_BUCKET}"
          fi

          uvx google-agents-cli@1.4.0 deploy \
            --project "${PROJECT_ID}" \
            --region "${{ vars.REGION }}" \
            --service-account="${{ vars.APP_SERVICE_ACCOUNT_STAGING || secrets.GCP_SERVICE_ACCOUNT }}" \
            --update-env-vars="${ENV_VARS}"

      - name: Fetch Auth Token
        id: fetch-token
        run: |
          _AUTH_TOKEN=$(gcloud auth print-access-token -q)
          echo "::add-mask::${_AUTH_TOKEN}"
          echo "_auth_token=${_AUTH_TOKEN}" >> $GITHUB_OUTPUT

      - name: Run load test
        run: |
          export _AUTH_TOKEN="${{ steps.fetch-token.outputs._auth_token }}"
          uvx locust==2.31.1 \
          -f tests/load_test/load_test.py \
          --headless \
          -t 30s -u 2 -r 0.5 \
          --csv=tests/load_test/.results/results \
          --html=tests/load_test/.results/report.html

      - name: Export Load Test Results to GCS
        run: |
          PROJECT_ID="${{ vars.STAGING_PROJECT_ID || vars.GOOGLE_CLOUD_PROJECT }}"
          PROJECT_NAME="${{ vars.PROJECT_NAME || 'sre-agent' }}"
          LOGS_BUCKET="${{ vars.LOGS_BUCKET_NAME_STAGING || vars.LOGS_BUCKET_NAME }}"
          if [ -z "$LOGS_BUCKET" ] && [ -n "$PROJECT_ID" ]; then
            LOGS_BUCKET="${PROJECT_ID}-${PROJECT_NAME}-logs"
          fi

          if [ -n "$LOGS_BUCKET" ]; then
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            gcloud storage cp --recursive tests/load_test/.results "gs://${LOGS_BUCKET}/load-test-results/results-${TIMESTAMP}" --quiet
            echo "_________________________________________________________________________"
            echo "Load test results copied to gs://${LOGS_BUCKET}/load-test-results/results-${TIMESTAMP}"
            echo "HTTP link: https://console.cloud.google.com/storage/browser/${LOGS_BUCKET}/load-test-results/results-${TIMESTAMP}"
            echo "_________________________________________________________________________"
          else
            echo "ℹ️ Skipping load test GCS export: Bucket name could not be resolved."
          fi

  call_production_workflow:
    needs: deploy_and_test_staging
    uses: ./.github/workflows/deploy-to-prod.yaml
    permissions:
      contents: 'read'
      id-token: 'write'
    secrets: inherit
