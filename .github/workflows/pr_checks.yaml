name: PR Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tests/**'
      - 'terraform/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - '.github/workflows/pr_checks.yaml'  

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.WORKLOAD_IDENTITY_PROVIDER || format('projects/{0}/locations/global/workloadIdentityPools/{1}/providers/{2}', vars.GCP_PROJECT_NUMBER, secrets.WIF_POOL_ID, secrets.WIF_PROVIDER_ID) }}"
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
          create_credentials_file: true
          project_id: ${{ vars.GOOGLE_CLOUD_PROJECT || vars.CICD_PROJECT_ID }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Run code quality check (ruff)
        run: uv run ruff check .

      - name: Run unit tests
        run: uv run pytest tests/unit

      - name: Run integration tests
        # Integration tests run the agent in-process; pytest doesn't load .env.
        env:
          GOOGLE_GENAI_USE_VERTEXAI: 'true'
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT || vars.CICD_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: global
        run: uv run pytest tests/integration
