name: PR Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tests/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - 'Dockerfile'
      - '.github/workflows/pr_checks.yaml'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WIF_POOL_ID }}/providers/${{ secrets.WIF_PROVIDER_ID }}'
          service_account: '${{ secrets.APP_SERVICE_ACCOUNT }}'
          create_credentials_file: true
          project_id: ${{ secrets.GOOGLE_CLOUD_PROJECT }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Run code quality check (ruff)
        run: uv run ruff check .

      - name: Run unit tests
        run: uv run pytest tests/unit

      - name: Run integration tests
        # Integration tests run the agent in-process; pytest doesn't load .env.
        env:
          GOOGLE_GENAI_USE_VERTEXAI: 'true'
          GOOGLE_GENAI_USE_ENTERPRISE: ${{ vars.GOOGLE_GENAI_USE_ENTERPRISE }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: global
        run: uv run pytest tests/integration
