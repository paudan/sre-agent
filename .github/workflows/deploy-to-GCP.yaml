name: Deploy to GCP

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tests/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - 'Dockerfile'
      - '.github/workflows/deploy-to-gcp.yaml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WIF_POOL_ID }}/providers/${{ secrets.WIF_PROVIDER_ID }}'
          service_account: '${{ secrets.APP_SERVICE_ACCOUNT }}'
          create_credentials_file: true
          project_id: ${{ secrets.GOOGLE_CLOUD_PROJECT }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          install_components: 'beta'

      - name: Install dependencies
        run: uv sync --locked

      - name: Deploy to GCP (Agent Runtime)
        run: |
          PROJECT_ID="${{ secrets.GOOGLE_CLOUD_PROJECT }}"
          LOGS_BUCKET="${{ secrets.LOGS_BUCKET_NAME }}"

          ENV_VARS="OTEL_RESOURCE_ATTRIBUTES=service.version=${{ github.sha }}"
          if [ -n "$LOGS_BUCKET" ]; then
            ENV_VARS="${ENV_VARS},LOGS_BUCKET_NAME=${LOGS_BUCKET}"
          fi
          if [ -n "${{ vars.GOOGLE_GENAI_USE_ENTERPRISE }}" ]; then
            ENV_VARS="${ENV_VARS},GOOGLE_GENAI_USE_ENTERPRISE=${{ vars.GOOGLE_GENAI_USE_ENTERPRISE }}"
          fi

          uvx google-agents-cli@1.9.0 deploy \
            --project "${PROJECT_ID}" \
            --region "${{ secrets.REGION }}" \
            --service-account="${{ secrets.APP_SERVICE_ACCOUNT }}" \
            --update-env-vars="${ENV_VARS}"

      - name: Fetch Auth Token
        id: fetch-token
        run: |
          _AUTH_TOKEN=$(gcloud auth print-access-token -q)
          echo "::add-mask::${_AUTH_TOKEN}"
          echo "_auth_token=${_AUTH_TOKEN}" >> $GITHUB_OUTPUT

      - name: Run load test
        run: |
          export _AUTH_TOKEN="${{ steps.fetch-token.outputs._auth_token }}"
          uvx locust==2.31.1 \
          -f tests/load_test/load_test.py \
          --headless \
          -t 30s -u 2 -r 0.5 \
          --csv=tests/load_test/.results/results \
          --html=tests/load_test/.results/report.html

      - name: Export Load Test Results to GCS
        run: |
          PROJECT_ID="${{ secrets.GOOGLE_CLOUD_PROJECT }}"
          LOGS_BUCKET="${{ secrets.LOGS_BUCKET_NAME }}"
          if [ -n "$LOGS_BUCKET" ]; then
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            gcloud storage cp --recursive tests/load_test/.results "gs://${LOGS_BUCKET}/load-test-results/results-${TIMESTAMP}" --quiet
            echo "_________________________________________________________________________"
            echo "Load test results copied to gs://${LOGS_BUCKET}/load-test-results/results-${TIMESTAMP}"
            echo "HTTP link: https://console.cloud.google.com/storage/browser/${LOGS_BUCKET}/load-test-results/results-${TIMESTAMP}"
            echo "_________________________________________________________________________"
          else
            echo "ℹ️ Skipping load test GCS export: Bucket name could not be resolved."
          fi
