name: Deploy to GCP

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tests/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - 'Dockerfile'
      - '.github/actions/deploy-agent/**'
      - '.github/workflows/deploy-to-gcp.yaml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # Gateway created by deployment/terraform/single-project/agent_gateway.tf
  AGENT_GATEWAY_NAME: sre-agent-egress-gateway

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WIF_POOL_ID }}/providers/${{ secrets.WIF_PROVIDER_ID }}
          service_account: ${{ secrets.APP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Look up Agent Gateway
        id: gateway
        env:
          PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          REGION: ${{ secrets.REGION }}
        run: |
          # Empty when the gateway does not exist: the action then leaves the binding unchanged
          gateway=$(gcloud network-services agent-gateways describe "$AGENT_GATEWAY_NAME" \
            --location "$REGION" --project "$PROJECT" --format='value(name)' 2>/dev/null || true)
          if [ -z "$gateway" ]; then
            echo "::notice::Agent Gateway '$AGENT_GATEWAY_NAME' not found in $PROJECT/$REGION; deploying without a gateway binding."
          fi
          echo "name=${gateway}" >> "$GITHUB_OUTPUT"

      # deployment_metadata.json is not committed (it holds the project number), so
      # point agents-cli at the existing engine instead of letting it create a new one.
      - name: Locate existing Agent Runtime engine
        env:
          PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          REGION: ${{ secrets.REGION }}
          ENGINE_NAME: sre-agent
        run: |
          engine=$(curl -s \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H "x-goog-user-project: $PROJECT" \
            "https://${REGION}-aiplatform.googleapis.com/v1/projects/${PROJECT}/locations/${REGION}/reasoningEngines" \
            | jq -r --arg n "$ENGINE_NAME" '[.reasoningEngines[]? | select(.displayName == $n)][0].name // empty')
          if [ -n "$engine" ]; then
            jq -n --arg id "$engine" \
              '{remote_agent_runtime_id: $id, deployment_target: "agent_runtime", is_a2a: true, agent_directory: "app"}' \
              > deployment_metadata.json
          else
            echo "::notice::No engine named '$ENGINE_NAME' found; the deploy will create one."
          fi

      - name: Build agent environment variables
        id: env
        run: |
          ENV_VARS="OTEL_RESOURCE_ATTRIBUTES=service.version=${{ github.sha }}"
          ENV_VARS="${ENV_VARS},LOGS_BUCKET_NAME=${{ secrets.LOGS_BUCKET_NAME }}"
          if [ -n "${{ vars.GOOGLE_GENAI_USE_ENTERPRISE }}" ]; then
            ENV_VARS="${ENV_VARS},GOOGLE_GENAI_USE_ENTERPRISE=${{ vars.GOOGLE_GENAI_USE_ENTERPRISE }}"
          fi
          echo "vars=${ENV_VARS}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/deploy-agent
        with:
          gcp_project_id: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          gcp_region: ${{ secrets.REGION }}
          logs_bucket_name: ${{ secrets.LOGS_BUCKET_NAME }}
          env_vars: ${{ steps.env.outputs.vars }}
          agent_gateway_egress: ${{ steps.gateway.outputs.name }}
