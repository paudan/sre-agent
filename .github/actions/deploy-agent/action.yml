name: Deploy agent
description: >
  Deploys an agents-cli project to Agent Runtime or Cloud Run, optionally binds it to an
  Agent Gateway, then runs the load test. Everything comes from inputs, nothing is read from
  Terraform. The caller must already be authenticated to Google Cloud (google-github-actions/auth).

inputs:
  agent_dir:
    description: Directory of the agents-cli project
    required: false
    default: "."
  deployment_target:
    description: agent_runtime or cloud_run
    required: false
    default: agent_runtime
  agents_cli_version:
    description: google-agents-cli version used to deploy
    required: false
    default: "1.9.0"
  python_version:
    required: false
    default: "3.12"
  env_vars:
    description: Comma-separated KEY=VALUE environment variables for the deployed agent
    required: false
    default: ""
  agent_gateway_egress:
    description: >
      Full resource name of the Agent Gateway to bind outbound traffic to
      (projects/P/locations/R/agentGateways/G). Agent Runtime only; requires an Agent Identity.
      Leave empty to keep the agent's current binding.
    required: false
    default: ""
  min_instances:
    description: Agent Runtime minimum instances
    required: false
    default: "1"
  service_name:
    description: Cloud Run service id; cloud_run only
    required: false
    default: ""
  service_account:
    description: Runtime service account email; cloud_run only (Agent Runtime agents use an Agent Identity)
    required: false
    default: ""
  artifact_registry_repo:
    description: Artifact Registry repo the Cloud Run image is pushed to; cloud_run only
    required: false
    default: ""
  run_load_test:
    required: false
    default: "true"
  gcp_project_id:
    required: true
  gcp_region:
    required: true
  logs_bucket_name:
    description: Bucket the load test results are copied to; skipped when empty
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python_version }}

    - uses: astral-sh/setup-uv@v8.0.0

    - name: uv sync
      shell: bash
      working-directory: ${{ inputs.agent_dir }}
      run: uv sync --locked

    - uses: google-github-actions/setup-gcloud@v3
      with:
        install_components: beta

    - name: Build and push image
      id: image
      if: inputs.deployment_target == 'cloud_run'
      shell: bash
      env:
        REGION: ${{ inputs.gcp_region }}
        PROJECT: ${{ inputs.gcp_project_id }}
        REPO: ${{ inputs.artifact_registry_repo }}
        SERVICE: ${{ inputs.service_name }}
        AGENT_DIR: ${{ inputs.agent_dir }}
      run: |
        gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
        image_base="${REGION}-docker.pkg.dev/${PROJECT}/${REPO}/${SERVICE}"
        docker build -t "${image_base}:${{ github.sha }}" -t "${image_base}:latest" "${AGENT_DIR}"
        docker push "${image_base}:${{ github.sha }}"
        docker push "${image_base}:latest"
        echo "image=${image_base}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

    - name: Deploy to Agent Runtime
      if: inputs.deployment_target == 'agent_runtime'
      shell: bash
      working-directory: ${{ inputs.agent_dir }}
      env:
        CLI_VERSION: ${{ inputs.agents_cli_version }}
        PROJECT: ${{ inputs.gcp_project_id }}
        REGION: ${{ inputs.gcp_region }}
        MIN_INSTANCES: ${{ inputs.min_instances }}
        ENV_VARS: ${{ inputs.env_vars }}
        GATEWAY: ${{ inputs.agent_gateway_egress }}
      run: |
        args=(--project "$PROJECT" --region "$REGION" --min-instances "$MIN_INSTANCES")
        [ -n "$ENV_VARS" ] && args+=(--update-env-vars "$ENV_VARS")
        [ -n "$GATEWAY" ] && args+=(--agent-gateway-egress "$GATEWAY")
        uvx "google-agents-cli@${CLI_VERSION}" deploy "${args[@]}"

    # agents-cli passes --no-cpu-throttling and --no-allow-unauthenticated here. Sizing, VPC
    # and secrets are left as they are: on an update gcloud keeps what is not passed.
    - name: Deploy to Cloud Run
      if: inputs.deployment_target == 'cloud_run'
      shell: bash
      working-directory: ${{ inputs.agent_dir }}
      env:
        CLI_VERSION: ${{ inputs.agents_cli_version }}
        PROJECT: ${{ inputs.gcp_project_id }}
        REGION: ${{ inputs.gcp_region }}
        SERVICE: ${{ inputs.service_name }}
        IMAGE: ${{ steps.image.outputs.image }}
        SERVICE_ACCOUNT: ${{ inputs.service_account }}
        ENV_VARS: ${{ inputs.env_vars }}
      run: |
        args=(--deployment-target cloud_run --project "$PROJECT" --region "$REGION"
              --service-name "$SERVICE" --image "$IMAGE")
        [ -n "$SERVICE_ACCOUNT" ] && args+=(--service-account "$SERVICE_ACCOUNT")
        [ -n "$ENV_VARS" ] && args+=(--update-env-vars "$ENV_VARS")
        uvx "google-agents-cli@${CLI_VERSION}" deploy "${args[@]}"

    - name: Run load test
      if: inputs.run_load_test == 'true'
      shell: bash
      working-directory: ${{ inputs.agent_dir }}
      run: |
        _AUTH_TOKEN=$(gcloud auth print-access-token -q)
        echo "::add-mask::${_AUTH_TOKEN}"
        export _AUTH_TOKEN
        uvx locust==2.31.1 \
          -f tests/load_test/load_test.py \
          --headless \
          -t 30s -u 2 -r 0.5 \
          --csv=tests/load_test/.results/results \
          --html=tests/load_test/.results/report.html

    - name: Export load test results to GCS
      if: inputs.run_load_test == 'true' && inputs.logs_bucket_name != ''
      shell: bash
      working-directory: ${{ inputs.agent_dir }}
      env:
        LOGS_BUCKET: ${{ inputs.logs_bucket_name }}
      run: |
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        gcloud storage cp --recursive tests/load_test/.results "gs://${LOGS_BUCKET}/load-test-results/results-${TIMESTAMP}" --quiet
        echo "Load test results copied to gs://${LOGS_BUCKET}/load-test-results/results-${TIMESTAMP}"
